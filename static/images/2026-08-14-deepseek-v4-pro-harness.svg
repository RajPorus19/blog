<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e2a"/>
      <stop offset="55%" stop-color="#12173e"/>
      <stop offset="100%" stop-color="#1b1b5e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#536af5"/>
      <stop offset="100%" stop-color="#8b9dff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="rgba(83,106,245,0.05)"/>
  <circle cx="1120" cy="560" r="260" fill="rgba(83,106,245,0.04)"/>
  <circle cx="520" cy="-40" r="170" fill="rgba(139,157,255,0.05)"/>

  <!-- Left: whale + plugin architecture illustration -->
  <g transform="translate(40, 70)">
    <!-- 1M tokens badge -->
    <rect x="0" y="0" width="150" height="38" rx="10" fill="rgba(83,106,245,0.12)" stroke="rgba(139,157,255,0.3)" stroke-width="1"/>
    <text x="75" y="16" text-anchor="middle" font-family="system-ui" font-size="11" fill="rgba(139,157,255,0.6)">CONTEXT</text>
    <text x="75" y="32" text-anchor="middle" font-family="monospace" font-size="15" fill="rgba(139,157,255,0.85)" font-weight="700">1M tokens</text>

    <!-- whale (DeepSeek) -->
    <g transform="translate(0, 60)">
      <!-- tail -->
      <path d="M78 210 L34 166 L62 206 L34 250 Z" fill="rgba(83,106,245,0.35)"/>
      <!-- body -->
      <ellipse cx="200" cy="210" rx="155" ry="74" fill="rgba(83,106,245,0.22)" stroke="rgba(139,157,255,0.4)" stroke-width="2"/>
      <!-- belly -->
      <path d="M75 246 Q205 306 335 246 Q205 270 75 246 Z" fill="rgba(139,157,255,0.16)"/>
      <!-- eye -->
      <circle cx="305" cy="196" r="6" fill="rgba(255,255,255,0.7)"/>
      <!-- spout -->
      <g fill="rgba(139,157,255,0.5)">
        <circle cx="300" cy="116" r="5"/>
        <circle cx="320" cy="98" r="4"/>
        <circle cx="308" cy="80" r="3"/>
      </g>
      <!-- token bubbles -->
      <circle cx="150" cy="140" r="4" fill="rgba(139,157,255,0.3)"/>
      <circle cx="250" cy="112" r="3" fill="rgba(139,157,255,0.22)"/>
      <circle cx="120" cy="90" r="3" fill="rgba(139,157,255,0.2)"/>
    </g>

    <!-- plugin architecture: everything is a plugin -->
    <g transform="translate(0, 250)">
      <line x1="150" y1="45" x2="90" y2="20" stroke="rgba(139,157,255,0.25)" stroke-width="2"/>
      <line x1="150" y1="45" x2="250" y2="20" stroke="rgba(139,157,255,0.25)" stroke-width="2"/>
      <line x1="150" y1="45" x2="90" y2="75" stroke="rgba(139,157,255,0.25)" stroke-width="2"/>
      <line x1="150" y1="45" x2="250" y2="75" stroke="rgba(139,157,255,0.25)" stroke-width="2"/>
      <circle cx="150" cy="45" r="20" fill="rgba(83,106,245,0.3)" stroke="rgba(139,157,255,0.55)" stroke-width="2"/>
      <text x="150" y="50" text-anchor="middle" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.85)" font-weight="700">dsh</text>
      <g font-family="monospace" font-size="10">
        <rect x="52" y="8" width="76" height="24" rx="5" fill="rgba(255,255,255,0.06)" stroke="rgba(139,157,255,0.25)" stroke-width="1"/>
        <text x="90" y="23" text-anchor="middle" fill="rgba(255,255,255,0.5)">model</text>
        <rect x="212" y="8" width="76" height="24" rx="5" fill="rgba(255,255,255,0.06)" stroke="rgba(139,157,255,0.25)" stroke-width="1"/>
        <text x="250" y="23" text-anchor="middle" fill="rgba(255,255,255,0.5)">tool</text>
        <rect x="52" y="63" width="76" height="24" rx="5" fill="rgba(255,255,255,0.06)" stroke="rgba(139,157,255,0.25)" stroke-width="1"/>
        <text x="90" y="78" text-anchor="middle" fill="rgba(255,255,255,0.5)">mcp</text>
        <rect x="212" y="63" width="76" height="24" rx="5" fill="rgba(255,255,255,0.06)" stroke="rgba(139,157,255,0.25)" stroke-width="1"/>
        <text x="250" y="78" text-anchor="middle" fill="rgba(255,255,255,0.5)">web</text>
      </g>
      <text x="150" y="112" text-anchor="middle" font-family="system-ui" font-size="12" fill="rgba(139,157,255,0.6)">everything is a plugin</text>
    </g>
  </g>

  <!-- Right side -->
  <g transform="translate(420, 0)">
    <rect x="0" y="150" width="150" height="28" rx="14" fill="rgba(255,255,255,0.14)"/>
    <text x="75" y="169" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)" font-weight="600">AI · OPEN SOURCE</text>

    <text x="0" y="228" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1.5">
      DeepSeek V4 Pro,
    </text>
    <text x="0" y="278" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1.5">
      1,6 T de paramètres,
    </text>
    <text x="0" y="328" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1.5">
      et tout est un plugin
    </text>

    <rect x="0" y="352" width="80" height="5" rx="2" fill="url(#accent)"/>

    <text x="0" y="396" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="21" fill="rgba(255,255,255,0.68)">
      Un million de tokens, des poids ouverts, et un harness open source
    </text>

    <g transform="translate(0, 440)">
      <rect x="0" y="0" width="85" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="42.5" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.72)">deepseek</text>
      <rect x="95" y="0" width="55" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="122.5" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.72)">moe</text>
      <rect x="160" y="0" width="75" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="197.5" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.72)">agents</text>
      <rect x="245" y="0" width="100" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="295" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.72)">open-source</text>
    </g>
  </g>

  <path d="M0 560 Q200 540 400 560 Q600 580 800 560 Q1000 540 1200 560 L1200 630 L0 630 Z" fill="rgba(83,106,245,0.06)"/>
</svg>
