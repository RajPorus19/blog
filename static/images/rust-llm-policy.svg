<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="100%" stop-color="#D2691E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4A460"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="220" fill="rgba(255,255,255,0.04)"/>
  <circle cx="1150" cy="500" r="280" fill="rgba(255,255,255,0.03)"/>
  <circle cx="700" cy="-60" r="180" fill="rgba(255,255,255,0.05)"/>

  <!-- Left: Shield/community illustration -->
  <g transform="translate(60, 130)">
    <!-- Shield shape -->
    <path d="M140 10 L260 10 L260 130 Q260 230 200 280 Q140 230 140 130 Z" 
          fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <!-- Gear inside shield (Rust logo nod) -->
    <circle cx="200" cy="140" r="40" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
    <circle cx="200" cy="140" r="20" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <!-- Teeth -->
    <g stroke="rgba(255,255,255,0.25)" stroke-width="3">
      <line x1="200" y1="95" x2="200" y2="105"/>
      <line x1="200" y1="175" x2="200" y2="185"/>
      <line x1="155" y1="140" x2="165" y2="140"/>
      <line x1="235" y1="140" x2="245" y2="140"/>
      <line x1="168" y1="108" x2="175" y2="115"/>
      <line x1="225" y1="165" x2="232" y2="172"/>
      <line x1="225" y1="108" x2="232" y2="115"/>
      <line x1="168" y1="165" x2="175" y2="172"/>
    </g>

    <!-- LLM node (AI symbol) floating above -->
    <g transform="translate(200, 20)" opacity="0.6">
      <circle cx="0" cy="0" r="8" fill="rgba(255,255,255,0.4)"/>
      <circle cx="-20" cy="5" r="5" fill="rgba(255,255,255,0.25)"/>
      <circle cx="20" cy="5" r="5" fill="rgba(255,255,255,0.25)"/>
      <line x1="0" y1="0" x2="-20" y2="5" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="20" y2="5" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    </g>

    <!-- Small community figures at bottom -->
    <g transform="translate(70, 280)" opacity="0.4">
      <circle cx="20" cy="10" r="8" fill="white"/>
      <rect x="14" y="20" width="12" height="16" rx="3" fill="white"/>
      <circle cx="60" cy="10" r="7" fill="white"/>
      <rect x="55" y="20" width="10" height="14" rx="3" fill="white"/>
      <circle cx="100" cy="10" r="8" fill="white"/>
      <rect x="94" y="20" width="12" height="16" rx="3" fill="white"/>
      <circle cx="140" cy="10" r="6" fill="white"/>
      <rect x="136" y="20" width="8" height="12" rx="3" fill="white"/>
    </g>
  </g>

  <!-- Right side -->
  <g transform="translate(420, 0)">
    <!-- Tag -->
    <rect x="0" y="170" width="100" height="28" rx="14" fill="rgba(255,255,255,0.15)"/>
    <text x="50" y="189" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.8)" font-weight="600">OPEN SOURCE</text>

    <text x="0" y="235" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="white" letter-spacing="-1">
      Rust a banni le code
    </text>
    <text x="0" y="285" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="rgba(255,255,255,0.85)">
      généré par LLM
    </text>

    <rect x="0" y="308" width="60" height="4" rx="2" fill="url(#accent)"/>

    <text x="0" y="350" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" fill="rgba(255,255,255,0.65)">
      Et c'est la bonne décision
    </text>

    <!-- Bottom tag pills -->
    <g transform="translate(0, 400)">
      <rect x="0" y="0" width="55" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="27.5" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">rust</text>
      <rect x="65" y="0" width="75" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="102.5" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">governance</text>
      <rect x="150" y="0" width="45" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="172.5" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">llm</text>
    </g>
  </g>

  <path d="M0 560 Q200 540 400 560 Q600 580 800 560 Q1000 540 1200 560 L1200 630 L0 630 Z" fill="rgba(255,255,255,0.05)"/>
</svg>