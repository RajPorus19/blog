<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a05"/>
      <stop offset="55%" stop-color="#2b0f07"/>
      <stop offset="100%" stop-color="#3d1205"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="rgba(249,115,22,0.05)"/>
  <circle cx="1120" cy="560" r="260" fill="rgba(249,115,22,0.04)"/>
  <circle cx="520" cy="-40" r="170" fill="rgba(251,191,36,0.05)"/>

  <!-- Left: ember + CPU lanes illustration -->
  <g transform="translate(40, 80)">
    <!-- CPU die -->
    <rect x="40" y="60" width="260" height="200" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
    <!-- die pins -->
    <g stroke="rgba(255,255,255,0.15)" stroke-width="2">
      <line x1="60" y1="60" x2="60" y2="48"/><line x1="80" y1="60" x2="80" y2="48"/>
      <line x1="100" y1="60" x2="100" y2="48"/><line x1="120" y1="60" x2="120" y2="48"/>
      <line x1="140" y1="60" x2="140" y2="48"/><line x1="160" y1="60" x2="160" y2="48"/>
      <line x1="180" y1="60" x2="180" y2="48"/><line x1="200" y1="60" x2="200" y2="48"/>
      <line x1="220" y1="60" x2="220" y2="48"/><line x1="240" y1="60" x2="240" y2="48"/>
      <line x1="260" y1="60" x2="260" y2="48"/><line x1="280" y1="60" x2="280" y2="48"/>
    </g>
    <!-- vector lanes -->
    <g>
      <rect x="60" y="90" width="220" height="16" rx="3" fill="rgba(249,115,22,0.16)"/>
      <rect x="60" y="116" width="220" height="16" rx="3" fill="rgba(249,115,22,0.12)"/>
      <rect x="60" y="142" width="220" height="16" rx="3" fill="rgba(249,115,22,0.18)"/>
      <rect x="60" y="168" width="220" height="16" rx="3" fill="rgba(249,115,22,0.10)"/>
      <rect x="60" y="194" width="220" height="16" rx="3" fill="rgba(249,115,22,0.14)"/>
    </g>
    <!-- lane ticks -->
    <g stroke="rgba(255,255,255,0.10)" stroke-width="1">
      <line x1="115" y1="90" x2="115" y2="106"/><line x1="170" y1="90" x2="170" y2="106"/><line x1="225" y1="90" x2="225" y2="106"/>
      <line x1="115" y1="142" x2="115" y2="158"/><line x1="170" y1="142" x2="170" y2="158"/><line x1="225" y1="142" x2="225" y2="158"/>
    </g>
    <!-- ember flame over die -->
    <g transform="translate(150, -20)">
      <path d="M0 20 C -30 -10 -38 -40 -16 -58 C -4 -68 6 -72 12 -80 C 20 -70 30 -66 34 -56 C 52 -40 40 -8 0 20 Z" fill="rgba(249,115,22,0.35)"/>
      <path d="M0 22 C -18 2 -22 -22 -8 -38 C -2 -46 4 -48 8 -54 C 14 -46 20 -44 22 -38 C 34 -24 24 0 0 22 Z" fill="rgba(251,191,36,0.5)"/>
      <path d="M0 22 C -8 12 -10 0 -2 -8 C 2 -12 6 -12 8 -16 C 12 -10 14 -8 14 -4 C 16 2 8 12 0 22 Z" fill="rgba(255,255,255,0.35)"/>
    </g>
    <!-- MELT badge -->
    <g transform="translate(60, 290)">
      <rect x="0" y="0" width="140" height="42" rx="10" fill="rgba(249,115,22,0.10)" stroke="rgba(249,115,22,0.22)" stroke-width="1"/>
      <text x="70" y="17" text-anchor="middle" font-family="system-ui" font-size="11" fill="rgba(249,115,22,0.55)">TAGLINE</text>
      <text x="70" y="34" text-anchor="middle" font-family="monospace" font-size="15" fill="rgba(251,191,36,0.8)" font-weight="700">Melt your CPU</text>
    </g>
    <!-- ISA chips -->
    <g transform="translate(60, 350)" font-family="monospace" font-size="11">
      <rect x="0" y="0" width="52" height="20" rx="4" fill="rgba(255,255,255,0.06)"/>
      <text x="26" y="14" text-anchor="middle" fill="rgba(255,255,255,0.45)">AVX2</text>
      <rect x="58" y="0" width="52" height="20" rx="4" fill="rgba(255,255,255,0.06)"/>
      <text x="84" y="14" text-anchor="middle" fill="rgba(255,255,255,0.45)">NEON</text>
      <rect x="116" y="0" width="52" height="20" rx="4" fill="rgba(255,255,255,0.06)"/>
      <text x="142" y="14" text-anchor="middle" fill="rgba(255,255,255,0.45)">SSE2</text>
      <rect x="174" y="0" width="52" height="20" rx="4" fill="rgba(255,255,255,0.06)"/>
      <text x="200" y="14" text-anchor="middle" fill="rgba(255,255,255,0.45)">WASM</text>
    </g>
  </g>

  <!-- Right side -->
  <g transform="translate(420, 0)">
    <rect x="0" y="150" width="120" height="28" rx="14" fill="rgba(255,255,255,0.14)"/>
    <text x="60" y="169" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)" font-weight="600">RUST · PERFORMANCE</text>

    <text x="0" y="228" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1.5">
      Écrire un kernel SIMD
    </text>
    <text x="0" y="278" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1.5">
      une seule fois, pour
    </text>
    <text x="0" y="328" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1.5">
      tous les CPU
    </text>

    <rect x="0" y="352" width="70" height="5" rx="2" fill="url(#accent)"/>

    <text x="0" y="396" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="21" fill="rgba(255,255,255,0.68)">
      Thermite SIMD : un kernel, toutes les ISA, le dérivé en bonus
    </text>

    <g transform="translate(0, 440)">
      <rect x="0" y="0" width="55" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="27.5" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.72)">simd</text>
      <rect x="65" y="0" width="60" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="95" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.72)">hpc</text>
      <rect x="135" y="0" width="55" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="162.5" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.72)">rust</text>
      <rect x="200" y="0" width="65" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="232.5" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.72)">math</text>
    </g>
  </g>

  <path d="M0 560 Q200 540 400 560 Q600 580 800 560 Q1000 540 1200 560 L1200 630 L0 630 Z" fill="rgba(249,115,22,0.06)"/>
</svg>
