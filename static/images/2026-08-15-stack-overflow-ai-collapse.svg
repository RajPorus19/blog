<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#160d07"/>
      <stop offset="55%" stop-color="#241408"/>
      <stop offset="100%" stop-color="#331c09"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f48024"/>
      <stop offset="100%" stop-color="#ffc46b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="rgba(244,128,36,0.06)"/>
  <circle cx="1120" cy="560" r="260" fill="rgba(244,128,36,0.05)"/>
  <circle cx="520" cy="-40" r="170" fill="rgba(255,196,107,0.06)"/>

  <!-- Left: collapsing stack + plunging graph -->
  <g transform="translate(40, 70)">
    <!-- plunging line graph -->
    <g>
      <rect x="0" y="0" width="300" height="170" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
      <!-- axes -->
      <line x1="24" y1="140" x2="280" y2="140" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
      <line x1="24" y1="20" x2="24" y2="140" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
      <!-- the cliff -->
      <path d="M30 30 L90 40 L140 45 L190 60 L235 120 L275 138" fill="none" stroke="rgba(244,128,36,0.9)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="30" cy="30" r="4" fill="rgba(255,196,107,0.9)"/>
      <circle cx="275" cy="138" r="4" fill="rgba(244,128,36,0.9)"/>
      <text x="34" y="24" font-family="monospace" font-size="11" fill="rgba(255,196,107,0.75)">2014</text>
      <text x="238" y="156" font-family="monospace" font-size="11" fill="rgba(244,128,36,0.75)">2026</text>
    </g>

    <!-- collapsing stack of blocks -->
    <g transform="translate(0, 190)">
      <rect x="0" y="118" width="120" height="34" rx="6" fill="rgba(244,128,36,0.16)" stroke="rgba(244,128,36,0.35)" stroke-width="1.5"/>
      <rect x="0" y="82" width="120" height="34" rx="6" fill="rgba(244,128,36,0.28)" stroke="rgba(244,128,36,0.45)" stroke-width="1.5"/>
      <rect x="0" y="46" width="120" height="34" rx="6" fill="rgba(244,128,36,0.42)" stroke="rgba(244,128,36,0.6)" stroke-width="1.5"/>
      <rect x="0" y="10" width="120" height="34" rx="6" fill="rgba(244,128,36,0.6)" stroke="rgba(255,196,107,0.7)" stroke-width="1.5"/>
      <!-- fallen block -->
      <rect x="8" y="156" width="90" height="28" rx="6" fill="rgba(244,128,36,0.35)" stroke="rgba(244,128,36,0.5)" stroke-width="1.5" transform="rotate(-14 53 170)"/>
    </g>

    <!-- label -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="220" height="42" rx="10" fill="rgba(244,128,36,0.10)" stroke="rgba(244,128,36,0.25)" stroke-width="1"/>
      <text x="110" y="17" text-anchor="middle" font-family="system-ui" font-size="11" fill="rgba(244,128,36,0.55)">QUESTIONS / MOIS</text>
      <text x="110" y="34" text-anchor="middle" font-family="monospace" font-size="15" fill="rgba(255,196,107,0.85)" font-weight="700">207 204 → 1 442</text>
    </g>
  </g>

  <!-- Right side -->
  <g transform="translate(420, 0)">
    <rect x="0" y="150" width="190" height="28" rx="14" fill="rgba(255,255,255,0.14)"/>
    <text x="95" y="169" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)" font-weight="600">COMMUNAUTÉ · IA</text>

    <text x="0" y="228" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1.5">
      Stack Overflow a
    </text>
    <text x="0" y="278" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1.5">
      perdu 99 % de
    </text>
    <text x="0" y="328" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1.5">
      ses questions
    </text>

    <rect x="0" y="352" width="70" height="5" rx="2" fill="url(#accent)"/>

    <text x="0" y="396" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="21" fill="rgba(255,255,255,0.68)">
      207 000 questions/mois en 2014, 1 442 en juillet 2026.
    </text>

    <g transform="translate(0, 440)">
      <rect x="0" y="0" width="120" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="60" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.72)">stackoverflow</text>
      <rect x="130" y="0" width="55" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="157.5" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.72)">chatgpt</text>
      <rect x="195" y="0" width="95" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="242.5" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.72)">communs</text>
      <rect x="300" y="0" width="70" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="335" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.72)">déclin</text>
    </g>
  </g>

  <path d="M0 560 Q200 540 400 560 Q600 580 800 560 Q1000 540 1200 560 L1200 630 L0 630 Z" fill="rgba(244,128,36,0.07)"/>
</svg>
