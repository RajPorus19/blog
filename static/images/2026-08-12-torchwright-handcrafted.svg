<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d3320"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="70" cy="70" r="220" fill="rgba(16,185,129,0.03)"/>
  <circle cx="1150" cy="580" r="250" fill="rgba(16,185,129,0.02)"/>
  <circle cx="500" cy="-30" r="160" fill="rgba(16,185,129,0.04)"/>

  <!-- Left: Hand-crafted transformer illustration -->
  <g transform="translate(40, 70)">
    <!-- Neural network layer nodes -->
    <g>
      <!-- Input layer -->
      <circle cx="30" cy="100" r="6" fill="rgba(16,185,129,0.3)"/>
      <circle cx="30" cy="140" r="6" fill="rgba(16,185,129,0.3)"/>
      <circle cx="30" cy="180" r="6" fill="rgba(16,185,129,0.3)"/>
      <circle cx="30" cy="220" r="6" fill="rgba(16,185,129,0.3)"/>

      <!-- Hidden layer 1 -->
      <circle cx="100" cy="80" r="6" fill="rgba(16,185,129,0.4)"/>
      <circle cx="100" cy="120" r="6" fill="rgba(16,185,129,0.4)"/>
      <circle cx="100" cy="160" r="6" fill="rgba(16,185,129,0.4)"/>
      <circle cx="100" cy="200" r="6" fill="rgba(16,185,129,0.4)"/>
      <circle cx="100" cy="240" r="6" fill="rgba(16,185,129,0.4)"/>

      <!-- Hidden layer 2 -->
      <circle cx="170" cy="80" r="6" fill="rgba(16,185,129,0.5)"/>
      <circle cx="170" cy="120" r="6" fill="rgba(16,185,129,0.5)"/>
      <circle cx="170" cy="160" r="6" fill="rgba(16,185,129,0.5)"/>
      <circle cx="170" cy="200" r="6" fill="rgba(16,185,129,0.5)"/>
      <circle cx="170" cy="240" r="6" fill="rgba(16,185,129,0.5)"/>

      <!-- Output -->
      <circle cx="240" cy="140" r="6" fill="rgba(16,185,129,0.6)"/>
      <circle cx="240" cy="180" r="6" fill="rgba(16,185,129,0.6)"/>

      <!-- Edges (connections are manually defined!) -->
      <g stroke="rgba(16,185,129,0.08)" stroke-width="1">
        <line x1="36" y1="100" x2="94" y2="80"/>
        <line x1="36" y1="100" x2="94" y2="120"/>
        <line x1="36" y1="140" x2="94" y2="120"/>
        <line x1="36" y1="140" x2="94" y2="160"/>
        <line x1="36" y1="180" x2="94" y2="160"/>
        <line x1="36" y1="180" x2="94" y2="200"/>
        <line x1="36" y1="220" x2="94" y2="200"/>
        <line x1="36" y1="220" x2="94" y2="240"/>
        <line x1="106" y1="80" x2="164" y2="80"/>
        <line x1="106" y1="120" x2="164" y2="120"/>
        <line x1="106" y1="160" x2="164" y2="160"/>
        <line x1="106" y1="200" x2="164" y2="200"/>
        <line x1="106" y1="240" x2="164" y2="240"/>
        <line x1="176" y1="140" x2="234" y2="140"/>
        <line x1="176" y1="180" x2="234" y2="180"/>
      </g>
      <!-- Highlighted "hand-crafted" edges -->
      <g stroke="rgba(16,185,129,0.25)" stroke-width="1.5" stroke-dasharray="3,3">
        <line x1="36" y1="100" x2="94" y2="160"/>
        <line x1="36" y1="220" x2="94" y2="80"/>
        <line x1="106" y1="80" x2="164" y2="240"/>
        <line x1="106" y1="240" x2="164" y2="80"/>
      </g>
    </g>

    <!-- Hand with pencil near output -->
    <g transform="translate(260, 120)" opacity="0.4">
      <text x="0" y="0" font-family="system-ui" font-size="18">✍️</text>
    </g>

    <!-- Math: 100% accuracy badge -->
    <g transform="translate(20, 280)">
      <rect x="0" y="0" width="130" height="40" rx="10" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.18)" stroke-width="1"/>
      <text x="65" y="17" text-anchor="middle" font-family="system-ui" font-size="11" fill="rgba(16,185,129,0.5)">PRÉCISION</text>
      <text x="65" y="33" text-anchor="middle" font-family="monospace" font-size="14" fill="rgba(16,185,129,0.7)" font-weight="700">100% · 12 chiffres</text>
    </g>

    <!-- Multiplication example -->
    <g transform="translate(180, 280)" opacity="0.5">
      <text x="0" y="10" font-family="monospace" font-size="13" fill="rgba(16,185,129,0.4)">9876543210</text>
      <text x="0" y="26" font-family="monospace" font-size="13" fill="rgba(16,185,129,0.3)">× 1234567890</text>
      <line x1="0" y1="30" x2="130" y2="30" stroke="rgba(16,185,129,0.15)" stroke-width="1"/>
      <text x="0" y="44" font-family="monospace" font-size="13" fill="rgba(16,185,129,0.45)">= 121932631112635…</text>
    </g>

    <!-- Compiler bracket -->
    <g transform="translate(40, 370)" opacity="0.3">
      <text x="0" y="10" font-family="system-ui" font-size="10" fill="rgba(16,185,129,0.3)">Torchwright compiler</text>
      <rect x="0" y="16" width="100" height="2" rx="1" fill="rgba(16,185,129,0.15)"/>
      <text x="0" y="30" font-family="system-ui" font-size="10" fill="rgba(16,185,129,0.2)">zero training required</text>
    </g>
  </g>

  <!-- Right side -->
  <g transform="translate(420, 0)">
    <rect x="0" y="155" width="90" height="28" rx="14" fill="rgba(255,255,255,0.12)"/>
    <text x="45" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.8)" font-weight="600">AI / ML</text>

    <text x="0" y="230" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="white" letter-spacing="-1">
      Le transformer écrit
    </text>
    <text x="0" y="278" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="white" letter-spacing="-1">
      à la main, sans entraînement
    </text>

    <rect x="0" y="302" width="60" height="4" rx="2" fill="url(#accent)"/>

    <text x="0" y="350" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" fill="rgba(255,255,255,0.65)">
      Torchwright définit les poids d'un transformer directement — 100% de précision en multiplication sur 12 chiffres. Les modèles frontier échouent à 7.
    </text>

    <g transform="translate(0, 420)">
      <rect x="0" y="0" width="80" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="40" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">transformers</text>
      <rect x="90" y="0" width="50" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="115" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">math</text>
      <rect x="150" y="0" width="45" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="172.5" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">compiler</text>
    </g>
  </g>

  <path d="M0 560 Q200 540 400 560 Q600 580 800 560 Q1000 540 1200 560 L1200 630 L0 630 Z" fill="rgba(16,185,129,0.04)"/>
</svg>