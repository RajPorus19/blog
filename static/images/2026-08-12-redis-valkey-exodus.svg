<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d0a0a"/>
      <stop offset="100%" stop-color="#1a1a4e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="valkey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="90" cy="90" r="230" fill="rgba(220,38,38,0.03)"/>
  <circle cx="1100" cy="520" r="270" fill="rgba(124,58,237,0.03)"/>
  <circle cx="650" cy="630" r="200" fill="rgba(124,58,237,0.04)"/>

  <!-- Left: Migration illustration -->
  <g transform="translate(50, 90)">
    <!-- Redis cube (left, fading) -->
    <g opacity="0.4">
      <rect x="0" y="60" width="140" height="140" rx="12" fill="rgba(220,38,38,0.08)" stroke="rgba(220,38,38,0.15)" stroke-width="1.5"/>
      <rect x="20" y="40" width="140" height="140" rx="12" fill="rgba(220,38,38,0.12)" stroke="rgba(220,38,38,0.2)" stroke-width="1.5"/>
      <!-- Redis cube face -->
      <rect x="40" y="20" width="140" height="140" rx="12" fill="rgba(220,38,38,0.18)" stroke="rgba(220,38,38,0.3)" stroke-width="1.5"/>
      <text x="110" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="rgba(220,38,38,0.5)" font-weight="800" letter-spacing="2">REDIS</text>
    </g>

    <!-- Arrow bridge -->
    <g>
      <path d="M220 90 Q280 90 280 50 Q280 20 320 20" stroke="rgba(124,58,237,0.4)" stroke-width="3" fill="none"/>
      <polygon points="318,14 328,20 318,26" fill="rgba(124,58,237,0.5)"/>
      <!-- Migration particles -->
      <circle cx="240" cy="70" r="3" fill="rgba(124,58,237,0.3)"/>
      <circle cx="260" cy="50" r="2" fill="rgba(124,58,237,0.25)"/>
      <circle cx="280" cy="30" r="3" fill="rgba(124,58,237,0.35)"/>
      <circle cx="300" cy="22" r="2" fill="rgba(124,58,237,0.3)"/>
    </g>

    <!-- Valkey cube (right, bright) -->
    <g>
      <rect x="330" y="0" width="140" height="140" rx="12" fill="rgba(124,58,237,0.08)" stroke="rgba(124,58,237,0.15)" stroke-width="1.5"/>
      <rect x="350" y="20" width="140" height="140" rx="12" fill="rgba(124,58,237,0.12)" stroke="rgba(124,58,237,0.2)" stroke-width="1.5"/>
      <rect x="370" y="40" width="140" height="140" rx="12" fill="rgba(124,58,237,0.22)" stroke="rgba(124,58,237,0.35)" stroke-width="1.5"/>
      <text x="440" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" fill="rgba(167,139,250,0.7)" font-weight="800" letter-spacing="3">VALKEY</text>
      <!-- Sparkle -->
      <text x="490" y="45" font-family="system-ui" font-size="16" fill="rgba(255,255,255,0.3)">✦</text>
    </g>

    <!-- Cloud/compute nodes at bottom -->
    <g opacity="0.25">
      <rect x="120" y="260" width="60" height="36" rx="6" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="150" y="283" text-anchor="middle" font-family="system-ui" font-size="8" fill="rgba(255,255,255,0.2)">STACKIT</text>
      <rect x="210" y="260" width="55" height="36" rx="6" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="237.5" y="283" text-anchor="middle" font-family="system-ui" font-size="8" fill="rgba(255,255,255,0.2)">IONOS</text>
      <rect x="295" y="260" width="70" height="36" rx="6" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="330" y="283" text-anchor="middle" font-family="system-ui" font-size="8" fill="rgba(255,255,255,0.2)">OVHcloud</text>
    </g>

    <!-- Speed lines -->
    <g stroke="rgba(124,58,237,0.08)" stroke-width="1" stroke-dasharray="3,5">
      <line x1="280" y1="230" x2="280" y2="280"/>
      <line x1="310" y1="220" x2="310" y2="275"/>
      <line x1="340" y1="230" x2="340" y2="280"/>
    </g>
  </g>

  <!-- Right side -->
  <g transform="translate(420, 0)">
    <rect x="0" y="160" width="80" height="28" rx="14" fill="rgba(255,255,255,0.12)"/>
    <text x="40" y="179" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.8)" font-weight="600">DATABASE</text>

    <text x="0" y="230" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="white" letter-spacing="-1">
      Redis → Valkey
    </text>
    <text x="0" y="278" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="white" letter-spacing="-1">
      l'exode a commencé
    </text>

    <rect x="0" y="302" width="60" height="4" rx="2" fill="url(#accent)"/>

    <text x="0" y="350" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" fill="rgba(255,255,255,0.65)">
      STACKIT, IONOS, OVHcloud — les clouds européens migrent massivement vers le fork. Et c'est plus gros que Redis.
    </text>

    <g transform="translate(0, 420)">
      <rect x="0" y="0" width="50" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="25" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">redis</text>
      <rect x="60" y="0" width="55" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="87.5" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">valkey</text>
      <rect x="125" y="0" width="55" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="152.5" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">foss</text>
    </g>
  </g>

  <path d="M0 560 Q200 540 400 560 Q600 580 800 560 Q1000 540 1200 560 L1200 630 L0 630 Z" fill="rgba(124,58,237,0.04)"/>
</svg>