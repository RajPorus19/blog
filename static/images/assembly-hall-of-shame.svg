<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#4a1942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="120" cy="100" r="200" fill="rgba(255,255,255,0.03)"/>
  <circle cx="1000" cy="550" r="250" fill="rgba(255,255,255,0.02)"/>

  <!-- Left: CPU + trophy illustration -->
  <g transform="translate(60, 100)">
    <!-- CPU chip -->
    <rect x="40" y="50" width="280" height="280" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <!-- Inner die -->
    <rect x="80" y="90" width="200" height="200" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <!-- Pins -->
    <g stroke="rgba(255,255,255,0.12)" stroke-width="2">
      <line x1="40" y1="80" x2="10" y2="80"/>
      <line x1="40" y1="120" x2="10" y2="120"/>
      <line x1="40" y1="160" x2="10" y2="160"/>
      <line x1="40" y1="200" x2="10" y2="200"/>
      <line x1="40" y1="240" x2="10" y2="240"/>
      <line x1="40" y1="280" x2="10" y2="280"/>
      <line x1="320" y1="80" x2="350" y2="80"/>
      <line x1="320" y1="120" x2="350" y2="120"/>
      <line x1="320" y1="160" x2="350" y2="160"/>
      <line x1="320" y1="200" x2="350" y2="200"/>
      <line x1="320" y1="240" x2="350" y2="240"/>
      <line x1="320" y1="280" x2="350" y2="280"/>
    </g>
    <!-- Assembly code on die -->
    <text x="100" y="180" font-family="monospace" font-size="22" fill="#e94560" font-weight="700" opacity="0.9">fxrstor64</text>
    <!-- Slowness indicator -->
    <text x="100" y="230" font-family="monospace" font-size="14" fill="rgba(255,255,255,0.35)">198,002,498,236</text>
    <text x="100" y="252" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.2)">cycles</text>

    <!-- Trophy (champion) -->
    <g transform="translate(270, 0)">
      <path d="M20 50 L20 30 Q20 10 40 10 L40 10 Q60 10 60 30 L60 50 Z" fill="url(#accent)" opacity="0.6"/>
      <rect x="12" y="48" width="56" height="8" rx="2" fill="url(#accent)" opacity="0.8"/>
      <rect x="22" y="56" width="8" height="12" fill="url(#accent)" opacity="0.5"/>
      <rect x="50" y="56" width="8" height="12" fill="url(#accent)" opacity="0.5"/>
      <rect x="20" y="68" width="40" height="6" rx="3" fill="url(#accent)" opacity="0.3"/>
      <text x="40" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="white" font-weight="700">🏆</text>
    </g>

    <!-- Speed lines -->
    <g stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="4,6">
      <line x1="180" y1="350" x2="180" y2="420"/>
      <line x1="130" y1="360" x2="90" y2="420"/>
      <line x1="230" y1="360" x2="270" y2="420"/>
    </g>
  </g>

  <!-- Right side -->
  <g transform="translate(420, 0)">
    <rect x="0" y="170" width="90" height="28" rx="14" fill="rgba(255,255,255,0.12)"/>
    <text x="45" y="189" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.8)" font-weight="600">HARDWARE</text>

    <text x="0" y="235" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="white" letter-spacing="-1">
      Assembly
    </text>
    <text x="0" y="280" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="white" letter-spacing="-1">
      Hall of Shame
    </text>

    <rect x="0" y="302" width="60" height="4" rx="2" fill="url(#accent)"/>

    <text x="0" y="345" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" fill="rgba(255,255,255,0.65)">
      Rendre les CPUs lents est un art — 62 secondes pour une seule instruction
    </text>

    <g transform="translate(0, 400)">
      <rect x="0" y="0" width="75" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="37.5" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">assembly</text>
      <rect x="85" y="0" width="50" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="110" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">cpu</text>
      <rect x="145" y="0" width="60" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="175" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">x86</text>
    </g>
  </g>

  <path d="M0 560 Q200 540 400 560 Q600 580 800 560 Q1000 540 1200 560 L1200 630 L0 630 Z" fill="rgba(255,255,255,0.04)"/>
</svg>