<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a0a"/>
      <stop offset="55%" stop-color="#2b0f0f"/>
      <stop offset="100%" stop-color="#3d1208"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="rgba(239,68,68,0.05)"/>
  <circle cx="1120" cy="560" r="260" fill="rgba(239,68,68,0.04)"/>
  <circle cx="520" cy="-40" r="170" fill="rgba(245,158,11,0.05)"/>

  <!-- Left: broken cloud + tape reels illustration -->
  <g transform="translate(40, 70)">
    <!-- warning badge -->
    <rect x="0" y="0" width="150" height="38" rx="10" fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.3)" stroke-width="1"/>
    <text x="75" y="16" text-anchor="middle" font-family="system-ui" font-size="11" fill="rgba(239,68,68,0.6)">DATA LOSS</text>
    <text x="75" y="32" text-anchor="middle" font-family="monospace" font-size="15" fill="rgba(245,158,11,0.85)" font-weight="700">50 TB</text>

    <!-- broken cloud -->
    <g transform="translate(30, 60)">
      <path d="M60 130 Q60 92 96 88 Q100 54 136 54 Q166 54 172 78 Q206 78 206 108 L206 130 Z" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
      <path d="M128 96 L108 118 M128 96 L150 116 M128 96 L128 124" stroke="rgba(239,68,68,0.7)" stroke-width="3" stroke-linecap="round"/>
      <path d="M60 130 L206 130" stroke="rgba(239,68,68,0.45)" stroke-width="2" stroke-dasharray="6 6"/>
    </g>

    <!-- tape reels / archive -->
    <g transform="translate(30, 240)">
      <rect x="0" y="0" width="180" height="130" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>
      <circle cx="62" cy="60" r="34" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
      <circle cx="62" cy="60" r="12" fill="rgba(245,158,11,0.4)"/>
      <circle cx="62" cy="60" r="5" fill="rgba(255,255,255,0.25)"/>
      <circle cx="130" cy="60" r="24" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
      <circle cx="130" cy="60" r="8" fill="rgba(245,158,11,0.35)"/>
      <line x1="96" y1="60" x2="106" y2="60" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
      <text x="90" y="120" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.5)">70 yrs · tapes</text>
    </g>
  </g>

  <!-- Right side -->
  <g transform="translate(420, 0)">
    <rect x="0" y="150" width="150" height="28" rx="14" fill="rgba(255,255,255,0.14)"/>
    <text x="75" y="169" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)" font-weight="600">DATA · ARCHIVES</text>

    <text x="0" y="228" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1.5">
      50 To perdus,
    </text>
    <text x="0" y="278" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1.5">
      70 ans d'archives
    </text>
    <text x="0" y="328" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1.5">
      en suspens
    </text>

    <rect x="0" y="352" width="80" height="5" rx="2" fill="url(#accent)"/>

    <text x="0" y="396" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="21" fill="rgba(255,255,255,0.68)">
      Nine PBS contre Iron Mountain : le cloud, c'est l'ordinateur d'un autre
    </text>

    <g transform="translate(0, 440)">
      <rect x="0" y="0" width="65" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="32.5" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.72)">cloud</text>
      <rect x="75" y="0" width="75" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="112.5" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.72)">backup</text>
      <rect x="160" y="0" width="90" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="205" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.72)">archivage</text>
      <rect x="260" y="0" width="80" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="300" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.72)">données</text>
    </g>
  </g>

  <path d="M0 560 Q200 540 400 560 Q600 580 800 560 Q1000 540 1200 560 L1200 630 L0 630 Z" fill="rgba(239,68,68,0.06)"/>
</svg>
