<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0c06"/>
      <stop offset="55%" stop-color="#2b1308"/>
      <stop offset="100%" stop-color="#3d180a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7139"/>
      <stop offset="100%" stop-color="#ffb86b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="rgba(255,113,57,0.06)"/>
  <circle cx="1120" cy="560" r="260" fill="rgba(255,113,57,0.05)"/>
  <circle cx="520" cy="-40" r="170" fill="rgba(255,184,107,0.06)"/>

  <!-- Left: shield + fox, blocking ads -->
  <g transform="translate(40, 70)">
    <!-- ad panels being blocked -->
    <g>
      <rect x="0" y="20" width="150" height="70" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
      <rect x="0" y="100" width="150" height="70" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
      <text x="75" y="60" text-anchor="middle" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.30)">ad_01</text>
      <text x="75" y="140" text-anchor="middle" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.26)">ad_02</text>
      <!-- blocking crosses -->
      <g stroke="rgba(255,113,57,0.75)" stroke-width="4" stroke-linecap="round">
        <line x1="58" y1="34" x2="92" y2="76"/>
        <line x1="92" y1="34" x2="58" y2="76"/>
        <line x1="58" y1="114" x2="92" y2="156"/>
        <line x1="92" y1="114" x2="58" y2="156"/>
      </g>
    </g>

    <!-- shield -->
    <g transform="translate(175, 30)">
      <path d="M95 10 L170 40 L170 110 Q170 175 95 205 Q20 175 20 110 L20 40 Z" fill="rgba(255,113,57,0.14)" stroke="rgba(255,113,57,0.55)" stroke-width="3"/>
      <path d="M95 28 L156 52 L156 110 Q156 160 95 184 Q34 160 34 110 L34 52 Z" fill="rgba(255,113,57,0.08)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
      <!-- fox head -->
      <g transform="translate(95, 108)">
        <path d="M-34 -6 L-16 -34 L-4 -14 Z" fill="rgba(255,113,57,0.75)"/>
        <path d="M34 -6 L16 -34 L4 -14 Z" fill="rgba(255,113,57,0.75)"/>
        <path d="M-30 -2 L0 -30 L30 -2 Q30 20 0 26 Q-30 20 -30 -2 Z" fill="rgba(255,113,57,0.8)"/>
        <path d="M-12 6 L0 -10 L12 6 Z" fill="rgba(255,184,107,0.7)"/>
        <circle cx="-12" cy="2" r="3" fill="rgba(30,12,6,0.9)"/>
        <circle cx="12" cy="2" r="3" fill="rgba(30,12,6,0.9)"/>
      </g>
    </g>

    <!-- label -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="200" height="42" rx="10" fill="rgba(255,113,57,0.10)" stroke="rgba(255,113,57,0.25)" stroke-width="1"/>
      <text x="100" y="17" text-anchor="middle" font-family="system-ui" font-size="11" fill="rgba(255,113,57,0.55)">STATUT</text>
      <text x="100" y="34" text-anchor="middle" font-family="monospace" font-size="15" fill="rgba(255,184,107,0.85)" font-weight="700">webRequestBlocking</text>
    </g>
  </g>

  <!-- Right side -->
  <g transform="translate(420, 0)">
    <rect x="0" y="150" width="220" height="28" rx="14" fill="rgba(255,255,255,0.14)"/>
    <text x="110" y="169" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)" font-weight="600">NAVIGATEURS · VIE PRIVÉE</text>

    <text x="0" y="228" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1.5">
      Firefox, dernier
    </text>
    <text x="0" y="278" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1.5">
      rempart d'uBlock
    </text>
    <text x="0" y="328" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1.5">
      Origin
    </text>

    <rect x="0" y="352" width="70" height="5" rx="2" fill="url(#accent)"/>

    <text x="0" y="396" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="21" fill="rgba(255,255,255,0.68)">
      Manifest V3 tue les bloqueurs de pub. Firefox refuse.
    </text>

    <g transform="translate(0, 440)">
      <rect x="0" y="0" width="75" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="37.5" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.72)">firefox</text>
      <rect x="85" y="0" width="60" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="115" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.72)">chrome</text>
      <rect x="155" y="0" width="100" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="205" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.72)">manifest-v3</text>
      <rect x="265" y="0" width="65" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="297.5" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.72)">bloqueur</text>
    </g>
  </g>

  <path d="M0 560 Q200 540 400 560 Q600 580 800 560 Q1000 540 1200 560 L1200 630 L0 630 Z" fill="rgba(255,113,57,0.07)"/>
</svg>
