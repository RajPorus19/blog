<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="55%" stop-color="#0a1e2c"/>
      <stop offset="100%" stop-color="#0d2a3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="220" fill="rgba(6,182,212,0.06)"/>
  <circle cx="1120" cy="560" r="260" fill="rgba(6,182,212,0.05)"/>
  <circle cx="520" cy="-40" r="170" fill="rgba(103,232,249,0.06)"/>

  <!-- Left: ESP32 chip, wall, breathing waveform -->
  <g transform="translate(40, 70)">
    <!-- ESP32 chip -->
    <g>
      <rect x="20" y="30" width="150" height="150" rx="12" fill="rgba(6,182,212,0.10)" stroke="rgba(103,232,249,0.4)" stroke-width="2"/>
      <rect x="40" y="52" width="110" height="60" rx="6" fill="rgba(6,182,212,0.18)" stroke="rgba(103,232,249,0.35)" stroke-width="1.5"/>
      <text x="95" y="78" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(103,232,249,0.8)">ESP32</text>
      <text x="95" y="94" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.4)">$4 · 64 subcarriers</text>
      <!-- pins -->
      <g stroke="rgba(103,232,249,0.3)" stroke-width="2">
        <line x1="35" y1="30" x2="35" y2="18"/><line x1="60" y1="30" x2="60" y2="18"/>
        <line x1="85" y1="30" x2="85" y2="18"/><line x1="110" y1="30" x2="110" y2="18"/>
        <line x1="135" y1="30" x2="135" y2="18"/><line x1="160" y1="30" x2="160" y2="18"/>
        <line x1="35" y1="180" x2="35" y2="192"/><line x1="60" y1="180" x2="60" y2="192"/>
        <line x1="85" y1="180" x2="85" y2="192"/><line x1="110" y1="180" x2="110" y2="192"/>
        <line x1="135" y1="180" x2="135" y2="192"/><line x1="160" y1="180" x2="160" y2="192"/>
      </g>
    </g>

    <!-- radiating waves -->
    <g transform="translate(190, 105)" fill="none" stroke="rgba(103,232,249,0.35)" stroke-width="2">
      <path d="M0 0 A 24 24 0 0 1 34 0" />
      <path d="M-6 0 A 40 40 0 0 1 52 0" stroke-opacity="0.28"/>
      <path d="M-12 0 A 56 56 0 0 1 70 0" stroke-opacity="0.22"/>
    </g>

    <!-- wall (drywall) -->
    <g transform="translate(0, 210)">
      <rect x="20" y="0" width="360" height="26" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
      <g stroke="rgba(255,255,255,0.10)" stroke-width="1">
        <line x1="20" y1="13" x2="380" y2="13"/>
      </g>
      <text x="200" y="40" text-anchor="middle" font-family="system-ui" font-size="11" fill="rgba(255,255,255,0.35)">cloison sèche — le RF passe au travers</text>
    </g>

    <!-- breathing waveform -->
    <g transform="translate(0, 270)">
      <path d="M0 26 Q 25 10 50 26 T 100 26 T 150 26 T 200 26 T 250 26 T 300 26 T 350 26" fill="none" stroke="rgba(103,232,249,0.8)" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="52" font-family="monospace" font-size="11" fill="rgba(103,232,249,0.6)">bande 0,3–1,2 Hz · respiration</text>
    </g>
  </g>

  <!-- Right side -->
  <g transform="translate(420, 0)">
    <rect x="0" y="150" width="190" height="28" rx="14" fill="rgba(255,255,255,0.14)"/>
    <text x="95" y="169" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)" font-weight="600">HARDWARE · DSP · RF</text>

    <text x="0" y="228" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1.5">
      Un ESP32 à 4 $
    </text>
    <text x="0" y="278" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1.5">
      voit à travers
    </text>
    <text x="0" y="328" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="-1.5">
      les murs
    </text>

    <rect x="0" y="352" width="70" height="5" rx="2" fill="url(#accent)"/>

    <text x="0" y="396" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="21" fill="rgba(255,255,255,0.68)">
      Le CSI Wi-Fi détecte votre respiration. Sans caméra.
    </text>

    <g transform="translate(0, 440)">
      <rect x="0" y="0" width="65" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="32.5" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.72)">esp32</text>
      <rect x="75" y="0" width="55" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="102.5" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.72)">wifi-csi</text>
      <rect x="140" y="0" width="55" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="167.5" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.72)">dsp</text>
      <rect x="205" y="0" width="90" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
      <text x="250" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.72)">vie-privée</text>
    </g>
  </g>

  <path d="M0 560 Q200 540 400 560 Q600 580 800 560 Q1000 540 1200 560 L1200 630 L0 630 Z" fill="rgba(6,182,212,0.07)"/>
</svg>
